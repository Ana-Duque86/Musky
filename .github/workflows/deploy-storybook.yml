# Build Storybook estático y despliega en el proyecto Vercel musky_storybook.
#
# Secrets del repositorio (GitHub → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN     → https://vercel.com/account/tokens
#   VERCEL_ORG_ID    → Team Settings del equipo (ID tipo team_…)
#
# VERCEL_PROJECT_ID está fijado abajo; puede moverse a secret si prefieres.

name: Deploy Storybook

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: prj_FcnaGKWhno5aq6YJZrwc3JUnRsQD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build:docs

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx vercel deploy apps/docs/storybook-static --yes --token "$VERCEL_TOKEN"

      - name: Deploy production (main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx vercel deploy apps/docs/storybook-static --prod --yes --token "$VERCEL_TOKEN"
